<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e08a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="60%" stop-color="#f3d77a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181e"/>
      <stop offset="45%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#202028"/>
    </linearGradient>
    <linearGradient id="sEngrave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e08a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7c6117"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="200" height="200" rx="32" fill="#0a0a0d"/>
  <rect x="0" y="0" width="200" height="200" rx="32" fill="url(#ambient)"/>
  <rect x="9" y="9" width="182" height="182" rx="25" fill="none" stroke="url(#goldL)" stroke-width="1.6"/>
  <rect x="16" y="16" width="168" height="168" rx="20" fill="none" stroke="#d4af37" stroke-opacity="0.28" stroke-width="0.8"/>

  <!-- corner ticks (small) -->
  <g stroke="#d4af37" stroke-width="1.1" stroke-linecap="round">
    <path d="M18 27 L27 18"/>
    <path d="M173 18 L182 27"/>
    <path d="M18 173 L27 182"/>
    <path d="M173 182 L182 173"/>
  </g>

  <!-- ============ FLAME ============ -->
  <path d="M100 46
           C 105 58, 114 65, 114 78
           A 13.5 13.5 0 1 1 86 78
           C 86 65, 95 58, 100 46 Z"
        fill="url(#goldL)"/>
  <path d="M100 55
           C 103 64, 109 69, 109 78
           A 9 9 0 1 1 91 78
           C 91 69, 97 64, 100 55 Z"
        fill="#ecc85e"/>
  <path d="M100 62
           C 102 68, 105 72, 105 78
           A 5.5 5.5 0 1 1 95 78
           C 95 72, 98 68, 100 62 Z"
        fill="url(#flameCore)"/>

  <!-- ============ OPEN LID (flip-top, like ST Dupont) ============ -->
  <!-- lid stands up behind the flame: visible rectangular flap -->
  <path d="M84 88 L116 88 L119 60 L81 60 Z" fill="#14141a" stroke="url(#goldL)" stroke-width="1.2"/>
  <!-- inner lid face highlight -->
  <path d="M86 86 L114 86 L116 63 L84 63 Z" fill="none" stroke="#d4af37" stroke-opacity="0.45" stroke-width="0.7"/>
  <!-- hinge connecting lid to body -->
  <rect x="88" y="86" width="24" height="5" rx="2.5" fill="url(#goldL)"/>
  <!-- striker wheel (zigzag) -->
  <path d="M96 88 L97 92 L99 88 L101 92 L103 88 L105 92 L107 88" fill="none" stroke="#d4af37" stroke-width="1.1" opacity="0.9"/>
  <!-- burner collar -->
  <rect x="92" y="100" width="16" height="6" rx="3" fill="url(#goldL)" opacity="0.9"/>

  <!-- ============ MAIN BODY ============ -->
  <rect x="78" y="106" width="44" height="60" rx="9" fill="url(#lacquer)" stroke="url(#goldL)" stroke-width="1.4"/>

  <!-- refined guilloché: only 3 fine lines -->
  <g stroke="#d4af37" stroke-opacity="0.2" stroke-width="0.8">
    <line x1="89" y1="114" x2="89" y2="158"/>
    <line x1="100" y1="114" x2="100" y2="158"/>
    <line x1="111" y1="114" x2="111" y2="158"/>
  </g>

  <!-- S engraved with subtle 3D relief -->
  <text x="100" y="151" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif" font-size="30" font-weight="600"
        fill="url(#sEngrave)"
        stroke="#0a0a0d" stroke-width="0.6"
        style="paint-order:stroke">S</text>

  <!-- ============ BASE ============ -->
  <path d="M84 172 Q100 178 116 172" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1"/>
</svg>
