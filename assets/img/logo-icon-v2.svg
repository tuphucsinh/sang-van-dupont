<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gGold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d77a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="gCream2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="55%" stop-color="#f6e3a0"/>
      <stop offset="100%" stop-color="#d9bb5e"/>
    </linearGradient>
    <radialGradient id="gGlow2" cx="0.5" cy="0.44" r="0.58">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="200" height="200" rx="30" fill="#0a0a0d"/>
  <rect x="0" y="0" width="200" height="200" rx="30" fill="url(#gGlow2)"/>

  <!-- Art Deco double border -->
  <rect x="8" y="8" width="184" height="184" rx="24" fill="none" stroke="url(#gGold2)" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="170" rx="19" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="0.8"/>

  <!-- corner ticks -->
  <g stroke="#d4af37" stroke-width="1.2" stroke-linecap="round">
    <path d="M14 26 L26 14"/>
    <path d="M174 14 L186 26"/>
    <path d="M14 174 L26 186"/>
    <path d="M174 186 L186 174"/>
  </g>

  <!-- laurel arcs -->
  <path d="M56 150 Q100 172 144 150" fill="none" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.2"/>
  <path d="M64 156 Q100 174 136 156" fill="none" stroke="#d4af37" stroke-opacity="0.28" stroke-width="1"/>

  <!-- outer flame -->
  <path d="M100 26
           C 110 50, 128 62, 128 88
           A 29 29 0 1 1 72 88
           C 72 62, 90 50, 100 26 Z"
        fill="url(#gGold2)"/>
  <!-- mid flame -->
  <path d="M100 44
           C 107 61, 117 70, 117 88
           A 18 18 0 1 1 83 88
           C 83 70, 93 61, 100 44 Z"
        fill="#e9c75c"/>
  <!-- inner flame: large bright core for the black S -->
  <path d="M100 52
           C 107 68, 119 77, 119 92
           A 17 17 0 1 1 81 92
           C 81 77, 93 68, 100 52 Z"
        fill="url(#gCream2)"/>

  <!-- black S inside the flame core -->
  <text x="100" y="98" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif" font-size="38" font-weight="700"
        fill="#0a0a0d" letter-spacing="0">S</text>

  <!-- flame base -->
  <path d="M84 130 Q100 124 116 130" fill="none" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>
